services:
  - type: web
    name: campushelp-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py ingest
    startCommand: cd backend && gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: campushelp-ai-backend.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://campushelp-ai.vercel.app
      - key: FRONTEND_ORIGIN_REGEXES
        value: ^https://campushelp[a-z0-9-]*\.vercel\.app$
      - key: AI_API_KEY
        sync: false
