<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CampusHelp AI answers university-information questions from approved documents and shows the source, or says when it cannot verify."
    />
    <title>CampusHelp AI</title>
    <script>
      try {
        var savedTheme = localStorage.getItem('campushelp.theme')
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var initialTheme = 'light'
        if (savedTheme === 'light' || savedTheme === 'dark') {
          initialTheme = savedTheme
        } else if (systemDark) {
          initialTheme = 'dark'
        }
        document.documentElement.dataset.theme = initialTheme
        document.documentElement.style.colorScheme = initialTheme
      } catch {}
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
